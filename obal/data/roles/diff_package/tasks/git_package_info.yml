---
- name: 'Get latest package info from git'
  rpmspec_query:
    spec_file: "{{ spec_file_path }}"
    query_format: "%{name}-%{version}-%{release}"
    macros: "{{ {'scl_prefix': scl + '-'} if scl else {} }}"
  register: git_package_info

- name: Set git package version
  set_fact:
    git_package_version: "{{ git_package_info.value }}"
