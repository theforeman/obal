---
- name: Compare rhpkg release destinations
  include_tasks: koji_rhpkg.yml
  when:
    - build_package_build_system | default('koji') == 'koji'
    - build_package_releaser == 'rhpkg'

- name: Compare Koji tags
  include_tasks: koji_tag.yml
  loop: "{{ koji_tags }}"
  loop_control:
    loop_var: tag
  when:
    - build_package_build_system | default('koji') != 'koji' or build_package_releaser == 'koji'
    - diff_package_tags is undefined

- name: Compare legacy Koji tags
  include_tasks: koji_old.yml
  when:
    - build_package_build_system | default('koji') != 'koji' or build_package_releaser == 'koji'
    - diff_package_tags is defined
