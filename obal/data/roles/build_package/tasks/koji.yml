---
- name: Validate Koji releaser selection
  assert:
    that:
      - build_package_releaser in ['koji', 'rhpkg']
      - not (build_package_releaser == 'rhpkg' and build_package_use_koji_build | bool)
      - build_package_releaser != 'koji' or koji_tags | length > 0
    fail_msg: Tito releases are no longer supported. Configure rhpkg_targets for dist-git releases or select koji for direct SRPM builds

- name: Release with rhpkg
  include_tasks: rhpkg_release.yml
  when: build_package_releaser == 'rhpkg'

- name: Build package with Koji
  when: build_package_releaser == 'koji'
  block:
    - name: Build package for Koji tag
      include_tasks: koji_build.yml
      loop: "{{ koji_tags }}"
      loop_control:
        loop_var: tag
