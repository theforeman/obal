---
- name: Validate source preparation
  assert:
    that:
      - setup_sources_git is not defined
    fail_msg: setup_sources_git required the removed Tito builder. Prepare sources declared by the spec file instead

- name: 'Set package_dir'
  set_fact:
    package_dir: "{{ inventory_dir }}/{{ package_base_dir }}/{{ inventory_hostname }}"

- name: 'Setup sources from specfile'
  include_tasks: specfile.yml
